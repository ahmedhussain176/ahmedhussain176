<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0a"/>

  <!-- Hexagon shapes for tech -->
  <g>
    <!-- Frontend -->
    <polygon points="100,50 150,20 200,50 200,120 150,150 100,120" fill="none" stroke="#ff0033" stroke-width="2"/>
    <text x="150" y="95" font-family="Arial" font-size="16" text-anchor="middle" fill="#ff0033" font-weight="bold">FRONTEND</text>

    <!-- Backend -->
    <polygon points="300,50 350,20 400,50 400,120 350,150 300,120" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <text x="350" y="95" font-family="Arial" font-size="16" text-anchor="middle" fill="#00d4ff" font-weight="bold">BACKEND</text>

    <!-- Security -->
    <polygon points="500,50 550,20 600,50 600,120 550,150 500,120" fill="none" stroke="#00ff88" stroke-width="2"/>
    <text x="550" y="95" font-family="Arial" font-size="16" text-anchor="middle" fill="#00ff88" font-weight="bold">SECURITY</text>

    <!-- DevOps -->
    <polygon points="700,50 750,20 800,50 800,120 750,150 700,120" fill="none" stroke="#ffd700" stroke-width="2"/>
    <text x="750" y="95" font-family="Arial" font-size="16" text-anchor="middle" fill="#ffd700" font-weight="bold">DEVOPS</text>
  </g>

  <!-- Tech items below -->
  <g font-family="monospace" font-size="12">
    <!-- Frontend -->
    <text x="150" y="200" text-anchor="middle" fill="#ff0033">React • Next.js</text>
    <text x="150" y="220" text-anchor="middle" fill="#ff0033">TypeScript • Tailwind</text>

    <!-- Backend -->
    <text x="350" y="200" text-anchor="middle" fill="#00d4ff">Node.js • Express</text>
    <text x="350" y="220" text-anchor="middle" fill="#00d4ff">APIs • Authentication</text>

    <!-- Security -->
    <text x="550" y="200" text-anchor="middle" fill="#00ff88">Penetration Testing</text>
    <text x="550" y="220" text-anchor="middle" fill="#00ff88">OWASP • Burp Suite</text>

    <!-- DevOps -->
    <text x="750" y="200" text-anchor="middle" fill="#ffd700">Docker • Git • AWS</text>
    <text x="750" y="220" text-anchor="middle" fill="#ffd700">Linux • CI/CD</text>
  </g>

  <!-- Connecting lines -->
  <line x1="200" y1="85" x2="300" y2="85" stroke="#ff0033" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>
  <line x1="400" y1="85" x2="500" y2="85" stroke="#00d4ff" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>
  <line x1="600" y1="85" x2="700" y2="85" stroke="#00ff88" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>
</svg>