<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a2a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff0033" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="120" font-family="monospace" font-size="60" font-weight="bold" text-anchor="middle" fill="#ff0033" filter="url(#glow)">
    AHMED HUSSAIN
  </text>

  <!-- Subtitle -->
  <text x="600" y="170" font-family="monospace" font-size="24" text-anchor="middle" fill="#00d4ff">
    Full Stack Developer | Ethical Hacker | Cybersecurity Expert
  </text>

  <!-- Decorative elements -->
  <circle cx="100" cy="50" r="3" fill="#ff0033" opacity="0.6"/>
  <circle cx="1100" cy="250" r="3" fill="#00d4ff" opacity="0.6"/>
  <line x1="50" y1="280" x2="1150" y2="280" stroke="#ff0033" stroke-width="2" opacity="0.5"/>
</svg>